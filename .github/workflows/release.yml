name: GitHub-Release

# Legt zu jedem Versions-Tag (v1.0.0, v2.0.0 …) ein Release mit automatischen Notizen an.
# Manuell starten: Tag und optional den Commit angeben; fehlt der Tag, legt GitHub ihn auf diesem Commit an.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, z. B. v1.0.0'
        required: true
      target:
        description: 'Commit für einen neuen Tag (leer = aktueller Stand von main)'
        required: false
      replace:
        description: 'Vorhandenes Release und Tag zuerst löschen und neu anlegen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ inputs.target || github.sha }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ "$REPLACE" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" 2>/dev/null || true
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "Calmwerk $TAG" --generate-notes
          fi
